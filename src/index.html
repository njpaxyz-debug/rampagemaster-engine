<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>RampageMaster High Resolution Gameplay</title>
  <style>
    :root {
      --panel: rgba(6, 8, 20, 0.92);
      --line: rgba(135, 205, 255, 0.2);
      --green: #39ff14;
      --blue: #00d4ff;
      --pink: #ff4f7a;
      --gold: #ffd76b;
      --themeSky: #17244c;
      --themeMid: #081426;
      color-scheme: dark;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      background: #02030a;
      color: #eef7ff;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, var(--themeSky), #02030a 68%);
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      image-rendering: pixelated;
      cursor: crosshair;
    }

    .hud {
      position: fixed;
      left: 14px;
      right: 14px;
      top: 14px;
      z-index: 10;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;
    }

    .card {
      pointer-events: auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(12px);
      padding: 12px 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(18px, 4vw, 34px);
      letter-spacing: 0.06em;
      line-height: 0.95;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(57,255,20,.5);
    }

    p {
      margin: 8px 0 0;
      max-width: 560px;
      color: rgba(238,247,255,.72);
      font-size: 13px;
      line-height: 1.45;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: min(620px, 54vw);
    }

    button {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      color: #eef7ff;
      padding: 9px 12px;
      font: inherit;
      font-weight: 900;
      letter-spacing: .04em;
      cursor: pointer;
    }

    button.is-active {
      color: var(--green);
      border-color: rgba(57,255,20,.7);
      box-shadow: 0 0 20px rgba(57,255,20,.2);
    }

    .gameHud {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 11;
      display: grid;
      grid-template-columns: repeat(3, minmax(96px, auto));
      gap: 8px;
      max-width: min(720px, calc(100vw - 28px));
    }

    .gameHud div {
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 14px;
      background: rgba(0,0,0,.48);
      padding: 8px 10px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
    }

    .gameHud b, .gameHud span {
      display: block;
      white-space: nowrap;
    }

    .gameHud b {
      color: var(--gold);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .gameHud span {
      margin-top: 2px;
      font-size: 13px;
      color: #eef7ff;
    }

    .toast {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 30;
      transform: translate(-50%, -50%) scale(.94);
      border: 1px solid rgba(255,215,107,.8);
      border-radius: 999px;
      background: rgba(0,0,0,.78);
      color: var(--gold);
      padding: 13px 20px;
      font-size: clamp(16px, 4vw, 32px);
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
      box-shadow: 0 0 36px rgba(255,215,107,.24);
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .debug {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 10;
      width: min(520px, calc(100vw - 28px));
      max-height: min(420px, 48vh);
      overflow: auto;
      white-space: pre-wrap;
      font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: rgba(238,247,255,.78);
    }

    code { color: var(--gold); }

    @media (max-width: 760px) {
      .hud { flex-direction: column; }
      .controls { justify-content: flex-start; max-width: calc(100vw - 28px); }
      .debug { display: none; }
      .gameHud { grid-template-columns: repeat(2, minmax(120px, auto)); bottom: 8px; left: 8px; right: 8px; }
      .gameHud div { padding: 6px 8px; }
      .gameHud span { font-size: 11px; }
    }
  </style>
</head>
<body>
  <canvas data-rampage-canvas></canvas>

  <header class="hud">
    <section class="card">
      <h1>RampageMaster<br />High-Res Gameplay</h1>
      <p>
        Default gameplay path. Rampage now auto-smashes buildings, triggers panic,
        pays Bones on collapse, updates combo, cycles high-resolution city themes,
        and uses the extracted v7.6.3 motion engine.
      </p>
    </section>

    <nav class="card controls" aria-label="High-resolution gameplay controls">
      <button class="is-active" data-rampage-intent="rampage">Rampage</button>
      <button data-rampage-intent="patrol">Patrol</button>
      <button data-rampage-intent="idle">Idle</button>
      <button data-rampage-intent="care">Care</button>
      <button data-rampage-intent="theme">Theme</button>
      <button data-rampage-intent="convert">Convert</button>
      <button data-rampage-intent="debug">Debug</button>
    </nav>
  </header>

  <section class="gameHud" data-rampage-hud></section>
  <div class="toast" data-rampage-toast>Rampage</div>
  <pre class="card debug" data-rampage-debug>Loading high-resolution gameplay...</pre>

  <script type="module" src="./app.js"></script>
</body>
</html>
