<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RampageMaster Animation Engine Smoke Test</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050713;
      color: #eef7ff;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      width: min(920px, calc(100vw - 32px));
      border: 1px solid rgba(135, 205, 255, 0.2);
      border-radius: 18px;
      background: rgba(6, 8, 20, 0.92);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.42);
      padding: 18px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(22px, 4vw, 38px);
      letter-spacing: 0.04em;
    }
    p {
      color: rgba(230, 240, 255, 0.72);
      line-height: 1.5;
    }
    canvas {
      width: 100%;
      aspect-ratio: 16 / 7;
      display: block;
      border-radius: 14px;
      background: linear-gradient(#17264f, #080a16 68%, #050509 68%);
      image-rendering: pixelated;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin: 16px 0;
    }
    pre {
      overflow: auto;
      max-height: 260px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.06);
      padding: 12px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <h1>RampageMaster Animation Engine Smoke Test</h1>
    <p>
      This page imports <code>src/animation/index.js</code>, creates a seeded biomechanical motion profile,
      advances it on a lightweight route graph, and renders the resulting gait/debug state.
    </p>
    <canvas id="stage" width="1280" height="560"></canvas>
    <pre id="debug">Loading module...</pre>
  </main>

  <script type="module">
    import MotionEngine from '../src/animation/index.js';

    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const debug = document.getElementById('debug');

    const city = {
      width: canvas.width,
      groundY: 390,
      buildings: [
        { id: 'b0', x: 80, y: 215, w: 90, h: 175, hp: 4, max: 6 },
        { id: 'b1', x: 220, y: 175, w: 110, h: 215, hp: 2, max: 7 },
        { id: 'b2', x: 420, y: 235, w: 150, h: 155, hp: 5, max: 5 },
        { id: 'b3', x: 680, y: 150, w: 125, h: 240, hp: 1, max: 8 },
        { id: 'b4', x: 930, y: 205, w: 140, h: 185, hp: 6, max: 6 }
      ],
      citizens: [
        { id: 'c0', x: 150, y: 390, fear: 0.55 },
        { id: 'c1', x: 565, y: 390, fear: 0.2 },
        { id: 'c2', x: 840, y: 390, fear: 0.9 }
      ]
    };

    const kaiju = MotionEngine.createKaijuMotion({
      seed: 'rampagemaster-smoke-v7-6-3',
      taxonomy: {
        kingdom: 'Kaiju',
        phylum: 'draco',
        genus: 'Giga-Rex',
        species: 'Giga-Rex Verdant Test'
      },
      phenotype: {
        height: 78,
        bulk: 71,
        agility: 42,
        wings: 36,
        tentacles: 8,
        armor: 55,
        rage: 64,
        cute: 28,
        terror: 82
      },
      x: 180,
      y: city.groundY,
      city
    });

    let previous = performance.now();

    function drawBuildings() {
      for (const b of city.buildings) {
        ctx.fillStyle = b.hp <= 1 ? '#3d1721' : '#151b2d';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = 'rgba(0, 212, 255, 0.45)';
        for (let y = b.y + 16; y < b.y + b.h - 10; y += 26) {
          for (let x = b.x + 12; x < b.x + b.w - 12; x += 24) {
            ctx.fillRect(x, y, 10, 12);
          }
        }
      }
    }

    function drawCitizens() {
      for (const c of city.citizens) {
        ctx.fillStyle = c.fear > 0.75 ? '#ff4f7a' : '#ffd76b';
        ctx.beginPath();
        ctx.arc(c.x, c.y - 18, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(c.x - 4, c.y - 12, 8, 18);
      }
    }

    function drawKaiju(state) {
      const bob = Math.sin(state.phase.step * Math.PI * 2) * state.pose.bob;
      const sway = Math.sin(state.phase.torso * Math.PI * 2) * state.pose.sway;
      const x = state.position.x;
      const y = state.position.y + bob;
      const scale = state.pose.scale;

      ctx.save();
      ctx.translate(x, y);
      ctx.scale(state.facing, 1);

      ctx.fillStyle = 'rgba(0,0,0,0.38)';
      ctx.beginPath();
      ctx.ellipse(0, 8, 58 * scale, 12 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#23552f';
      ctx.lineWidth = 20 * scale;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(34 * scale, -70 * scale);
      ctx.quadraticCurveTo(118 * scale, -50 * scale + sway, 142 * scale, -8 * scale);
      ctx.stroke();

      ctx.fillStyle = '#123b1f';
      ctx.beginPath();
      ctx.ellipse(0, -118 * scale, 62 * scale, 82 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#39ff14';
      ctx.beginPath();
      ctx.ellipse(0, -122 * scale, 45 * scale, 62 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#123b1f';
      ctx.beginPath();
      ctx.ellipse(8 * scale, -205 * scale + sway, 40 * scale, 30 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffd76b';
      ctx.beginPath();
      ctx.arc(-8 * scale, -210 * scale + sway, 7 * scale, 0, Math.PI * 2);
      ctx.arc(22 * scale, -210 * scale + sway, 7 * scale, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#39ff14';
      ctx.lineWidth = 7 * scale;
      ctx.beginPath();
      ctx.moveTo(-28 * scale, -46 * scale);
      ctx.lineTo(-38 * scale + state.limbs.leftFoot * 16, 0);
      ctx.moveTo(30 * scale, -46 * scale);
      ctx.lineTo(42 * scale + state.limbs.rightFoot * 16, 0);
      ctx.stroke();

      ctx.restore();
    }

    function loop(now) {
      const dt = Math.min(0.05, (now - previous) / 1000);
      previous = now;
      const state = MotionEngine.updateMotion(kaiju, dt, { city, intent: 'rampage' });

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBuildings();
      drawCitizens();
      drawKaiju(state);

      debug.textContent = JSON.stringify({
        version: MotionEngine.VERSION,
        state: state.state,
        gait: state.gait,
        target: state.target,
        position: state.position,
        pose: state.pose,
        limbs: state.limbs,
        biomech: state.biomech
      }, null, 2);

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
